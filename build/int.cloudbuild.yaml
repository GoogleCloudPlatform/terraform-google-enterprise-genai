timeout: 14400s
steps:
- id: prepare
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'source /usr/local/bin/task_helper_functions.sh && prepare_environment']
  env:
  - 'TF_VAR_org_id=$_ORG_ID'
  - 'TF_VAR_project_id=$_PROJECT_ID'
  - 'TF_VAR_project_number=$_PROJECT_NUMBER'

- id: sleep
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'sleep 900']

- id: init
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgent --stage init --verbose']

- id: apply-infra
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgent --stage apply --verbose']

- id: verify-infra
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'VERIFY_PHASE=infra cft test run TestMortgageAgent --stage verify --verbose']

- id: apply-agent
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'VERIFY_PHASE=apply-agent cft test run TestMortgageAgent --stage verify --verbose']

- id: verify-agent
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'VERIFY_PHASE=verify-agent cft test run TestMortgageAgent --stage verify --verbose']

- id: destroy
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgent --stage destroy --verbose']

tags:
- 'ci'
- 'integration'
substitutions:
  _DOCKER_IMAGE_DEVELOPER_TOOLS: 'cft/developer-tools'
  _DOCKER_TAG_VERSION_DEVELOPER_TOOLS: '1.26'
  _MCP_SSL_CERTIFICATE_ID: ''
  _DNS_ZONE_NAME: ''
options:
  env:
  - 'TF_VAR_org_id=$_ORG_ID'
  - 'TF_VAR_project_id=$_PROJECT_ID'
  - 'TF_VAR_project_number=$_PROJECT_NUMBER'
  - 'TF_VAR_dns_zone_domain=$_DNS_ZONE_DOMAIN'
  - 'TF_VAR_dns_zone_name=$_DNS_ZONE_NAME'
  - 'TF_VAR_mcp_ssl_certificate_id=$_MCP_SSL_CERTIFICATE_ID'
  - 'TF_VAR_platform_admin_members=$_PLATFORM_ADMIN_MEMBERS'
  - 'TF_VAR_bucket_force_destroy=true'
  - 'TF_VAR_kms_prevent_destroy=false'
  - 'TF_IN_AUTOMATION=true'
