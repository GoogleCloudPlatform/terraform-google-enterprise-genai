timeout: 14400s
steps:

- id: prepare
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'source /usr/local/bin/task_helper_functions.sh && prepare_environment']
  env:
  - 'TF_VAR_folder_id=$_FOLDER_ID'
  - 'TF_VAR_billing_account=$_BILLING_ACCOUNT'

- id: sleep
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'sleep 480']

- id: create-standalone
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestStandalone --stage init --verbose --test-dir /workspace/test/integration']

- id: converge-standalone
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestStandalone --stage apply --verbose --test-dir /workspace/test/integration']

- id: verify-standalone
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestStandalone --stage verify --verbose --test-dir /workspace/test/integration']

- id: create-appsource-artifact-registry
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestArtifactRegistrySource --stage verify --verbose --test-dir /workspace/test/integration']

- id: create-appsource-service-catalog
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestServiceCatalogSource --stage verify --verbose --test-dir /workspace/test/integration']

- id: create-mortgage-infra
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgentInfra --stage init --verbose --test-dir /workspace/test/integration']

- id: converge-mortgage-infra
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgentInfra --stage apply --verbose --test-dir /workspace/test/integration']

- id: verify-mortgage-infra
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgentInfra --stage verify --verbose --test-dir /workspace/test/integration']

- id: apply-mortgage-agent
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestMortgageAgent --stage verify --verbose --test-dir /workspace/test/integration']

- id: destroy-standalone
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args: ['/bin/bash', '-c', 'cft test run TestStandalone --stage destroy --verbose --test-dir /workspace/test/integration']

- id: destroy-mortgage
  name: 'gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS'
  args:
  - '/bin/bash'
  - '-c'
  - |
    echo "=== Cleaning up Reasoning Engine deployed during apply-agent ==="
    if [ -f /workspace/examples/mortgage-agent/.cft-reasoning-engine ]; then
      ENGINE=$$(cat /workspace/examples/mortgage-agent/.cft-reasoning-engine)
      if [ -n "$$ENGINE" ]; then
        echo "Deleting Reasoning Engine: $$ENGINE"
        TOKEN=$$(gcloud auth print-access-token)
        curl -sS -X DELETE -H "Authorization: Bearer $${TOKEN}" "https://us-central1-aiplatform.googleapis.com/v1beta1/$${ENGINE}?force=true" || true
      fi
    fi

    echo "=== Running CFT Blueprint Test teardown and Terraform destroy ==="
    cft test run TestMortgageAgent --stage destroy --verbose --test-dir /workspace/test/integration

tags:
- 'ci'
- 'integration'
options:
  env:
  - 'TF_VAR_org_id=$_ORG_ID'
  - 'TF_VAR_group_email=test-gcp-org-admins@test.blueprints.joonix.net'
  - 'TF_VAR_create_access_context_manager_access_policy=false'
  - 'TF_VAR_default_region=us-central1'
  - 'TF_VAR_instance_region=us-central1'
  - 'TF_VAR_dns_zone_domain=$_DNS_ZONE_DOMAIN'
  - 'TF_VAR_mcp_ssl_certificate_id=$_MCP_SSL_CERTIFICATE_ID'
  - 'TF_IN_AUTOMATION=true'
substitutions:
  _DOCKER_IMAGE_DEVELOPER_TOOLS: 'cft/developer-tools'
  _DOCKER_TAG_VERSION_DEVELOPER_TOOLS: '1.26'
