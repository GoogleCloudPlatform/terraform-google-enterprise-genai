apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: income-verification
  labels:
    component: mcp-server
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Default
      annotations:
        run.googleapis.com/sessionAffinity: "false"
        autoscaling.knative.dev/minScale: 1
        autoscaling.knative.dev/maxScale: 3
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: mcp-income-verification@mortgage-example-geap.iam.gserviceaccount.com
      containers:
      - image: us-central1-docker.pkg.dev/mortgage-example-geap/gateway-docker/income-verification-api
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: mortgage-example-geap
        - name: OTEL_SERVICE_NAME
          value: income-verification
        resources:
          limits:
            cpu: 1
            memory: 512Mi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 8080
  traffic:
  - percent: 100
    latestRevision: true
